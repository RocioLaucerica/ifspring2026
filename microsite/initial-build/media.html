<script>
  // simple toggle for grid tab info
  const tabs = document.querySelectorAll('.grid-tab');
  tabs.forEach(tab => {
    tab.style.display = 'none';
    tab.previousElementSibling.addEventListener('click', () => {
      tab.style.display = tab.style.display === 'block' ? 'none' : 'block';
    });
  });
</script>
